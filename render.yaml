services:
  # Backend Web Service
  - type: web
    name: salon-backend
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: salon-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: "12"
      - key: CLIENT_URL
        value: https://salon-frontend.onrender.com # Update with your actual frontend URL after deployment
      - key: STRIPE_SECRET_KEY
        sync: false # Set in the Render Dashboard under Environment Variables
      - key: STRIPE_WEBHOOK_SECRET
        sync: false # Set in the Render Dashboard under Environment Variables
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_SECURE
        value: "false"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false

  # Frontend Web Service
  - type: web
    name: salon-frontend
    env: docker
    dockerContext: frontend
    dockerfilePath: frontend/Dockerfile
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://salon-be-ogls.onrender.com/api

databases:
  - name: salon-db
    databaseName: salon
    user: postgres
    plan: free
